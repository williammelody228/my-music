<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 음악">
<meta name="theme-color" content="#0e0e13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 음악</title>
<style>
:root{--bg:#0e0e13;--bg2:#17171f;--bg3:#23232e;--tx:#f3f3f7;--tx2:#9b9bab;--ac:#ff4d6d;--line:#ffffff14;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}

#app{height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-t)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
h1{font-size:28px;margin:0;letter-spacing:-.5px}
h2{margin:0}
.pill{background:var(--ac);color:#fff;border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.ghost{background:var(--bg3);color:var(--tx)}
.pill.wide,.wide{width:100%}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tabs button{padding:7px 16px;border-radius:999px;background:var(--bg2);color:var(--tx2);font-weight:600}
.tabs button.on{background:var(--tx);color:#000}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 24px}
.has-mini main{padding-bottom:calc(92px + var(--safe-b))}

.toolbar{padding:4px 16px 8px}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .pill{flex:1}
input[type=search],input[type=text]{width:100%;background:var(--bg3);border:0;border-radius:10px;padding:12px;color:var(--tx);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.box{margin:8px 16px;padding:12px 14px;background:var(--bg2);border-radius:12px;font-size:14px;color:var(--tx2);line-height:1.5}
.box button{color:var(--ac);font-weight:600;margin-top:6px}
.empty{text-align:center;color:var(--tx2);padding:48px 32px;line-height:1.6}
.empty .pill{margin-top:16px}
.hint{font-size:12px;color:var(--tx2);text-align:center;padding:20px 16px}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px}
.row:active{background:var(--bg2)}
.row .info{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:var(--ac)}
.more,.chev{width:40px;height:40px;display:grid;place-items:center;color:var(--tx2);flex:none}
.chev{font-size:22px}
.art{background-size:cover;background-position:center;display:grid;place-items:center;color:#ffffffb0;flex:none;border-radius:8px}
.art.sm{width:48px;height:48px;font-size:20px}
.art.big{width:min(78vw,44dvh,360px);aspect-ratio:1;border-radius:16px;font-size:80px;box-shadow:0 20px 50px #0008}
.art.mid{width:96px;height:96px;font-size:40px;border-radius:12px}

.detail-head{display:flex;align-items:center;gap:4px;padding:0 8px 0 8px}
.detail-head .back{color:var(--ac);font-weight:600;padding:10px 8px;white-space:nowrap}
.detail-head h2{flex:1;font-size:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-sub{text-align:center;color:var(--tx2);font-size:13px;margin:0 0 6px}

.mini{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));z-index:20;background:var(--bg3);border-radius:14px;padding:8px 6px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px #0008;overflow:hidden}
.mini .info{flex:1;min-width:0}
.mini .icon{width:44px;height:44px;display:grid;place-items:center}
.mbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff1f}
.mbar i{display:block;height:100%;width:0;background:var(--ac)}

.player{position:fixed;inset:0;z-index:30;background:linear-gradient(#2c2c3d,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;padding:calc(var(--safe-t) + 6px) 24px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.player.open{transform:none}
.p-top{width:100%;display:flex;align-items:center;justify-content:space-between;height:44px}
.p-top button{width:44px;height:44px;display:grid;place-items:center}
.p-top span{font-size:13px;color:var(--tx2);letter-spacing:.5px}
.stage{flex:1;display:grid;place-items:center;width:100%;min-height:0}
.p-meta{width:100%;max-width:380px}
.p-meta .t{font-size:22px;font-weight:700}
.p-meta .s{font-size:16px}
.p-seek{width:100%;max-width:380px;margin-top:10px}
.p-times{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--tx) var(--p,0%),#ffffff33 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--tx);margin-top:-5px}
.controls{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;margin:10px 0 14px}
.ctl{width:52px;height:52px;display:grid;place-items:center;color:var(--tx)}
.ctl.on{color:var(--ac)}
.ctl.main{width:74px;height:74px;background:var(--tx);color:#000;border-radius:50%}
.p-extra{display:flex;gap:10px}

#sheet{position:fixed;inset:0;z-index:50;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:flex-end}
#sheet.open{opacity:1;pointer-events:auto}
#sheetPanel{width:100%;max-height:85dvh;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + var(--safe-b));transform:translateY(30px);transition:transform .2s}
#sheet.open #sheetPanel{transform:none}
.sh-title{font-weight:700;font-size:17px;padding-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-item{display:block;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-size:17px}
.sh-item.danger{color:#ff6b6b}
.sh-item:last-child{border-bottom:0}
.field{display:block;font-size:13px;color:var(--tx2);margin-top:14px}
.field input{margin-top:6px}
.ed-top{display:flex;gap:14px;align-items:center;margin-top:6px}
.ed-btns{display:flex;flex-direction:column;gap:8px}
.pickrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.pickrow input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.pickrow .t{flex:1}
.pickhead{display:flex;justify-content:flex-end;margin-bottom:4px}
.pickhead button{color:var(--ac);font-weight:600;padding:6px 2px}
.picklist{margin-bottom:14px}

#toast{position:fixed;top:calc(var(--safe-t) + 10px);left:50%;transform:translate(-50%,-20px);z-index:60;background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:all .25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>내 음악</h1>
    <button class="pill" id="btnAdd"></button>
  </header>
  <nav class="tabs">
    <button data-tab="songs" class="on">곡</button>
    <button data-tab="lists">재생목록</button>
  </nav>

  <main>
    <div id="installHint" class="box" hidden>
      홈 화면에 추가해서 쓰면 오프라인 재생이 되고 저장된 곡이 안전하게 유지돼요.<br>
      Safari 공유 버튼 → <b>홈 화면에 추가</b> 후 그 아이콘으로 실행하세요.
      <br><button id="hintClose">알겠어요, 닫기</button>
    </div>

    <section id="view-songs">
      <div class="toolbar" id="songsBar">
        <input id="search" type="search" placeholder="제목·아티스트 검색" enterkeyhint="search">
        <div class="btnrow">
          <button class="pill" id="playAll"></button>
          <button class="pill ghost" id="shuffleAll"></button>
        </div>
      </div>
      <ul class="list" id="songList"></ul>
      <div class="empty" id="empty">
        아직 곡이 없어요.<br>아래 버튼을 눌러 파일 앱에서 음악 파일을 선택하세요.<br>여러 곡을 한 번에 고를 수 있어요.
        <br><button class="pill" id="emptyAdd"></button>
      </div>
      <div class="hint" id="storageInfo"></div>
      <div class="hint" style="padding-top:0" id="verInfo"></div>
    </section>

    <section id="view-lists" hidden>
      <div class="toolbar"><button class="pill wide" id="newList"></button></div>
      <ul class="list" id="listList"></ul>
      <div class="empty" id="noLists">재생목록이 없어요.<br>위 버튼으로 새 재생목록을 만들어 보세요.</div>
    </section>

    <section id="view-detail" hidden>
      <div class="detail-head">
        <button class="back" id="backLists">‹ 재생목록</button>
        <h2 id="ldName"></h2>
        <button class="more" id="ldMenu" aria-label="재생목록 메뉴"></button>
      </div>
      <p class="detail-sub" id="ldCount"></p>
      <div class="toolbar">
        <div class="btnrow">
          <button class="pill" id="ldPlay"></button>
          <button class="pill ghost" id="ldShuffle"></button>
          <button class="pill ghost" id="ldAdd"></button>
        </div>
      </div>
      <ul class="list" id="ldTracks"></ul>
      <div class="empty" id="ldEmpty">이 재생목록은 비어 있어요.<br>‘곡 추가’ 버튼으로 곡을 넣어 보세요.</div>
    </section>
  </main>

  <div class="mini" id="mini" hidden>
    <div class="art sm" id="miniArt"></div>
    <div class="info"><div class="t" id="mTitle"></div><div class="s" id="mArtist"></div></div>
    <button class="icon" id="mPlay" aria-label="재생/일시정지"></button>
    <button class="icon" id="mNext" aria-label="다음 곡"></button>
    <div class="mbar"><i id="mProg"></i></div>
  </div>
</div>

<div class="player" id="player">
  <div class="p-top">
    <button id="closePlayer" aria-label="닫기"></button>
    <span>재생 중</span>
    <i style="width:44px"></i>
  </div>
  <div class="stage"><div class="art big" id="bigArt"></div></div>
  <div class="p-meta"><div class="t" id="pTitle"></div><div class="s" id="pArtist"></div></div>
  <div class="p-seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
    <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="controls">
    <button class="ctl" id="pShuffle" aria-label="셔플"></button>
    <button class="ctl" id="pPrev" aria-label="이전 곡"></button>
    <button class="ctl main" id="pPlay" aria-label="재생/일시정지"></button>
    <button class="ctl" id="pNext" aria-label="다음 곡"></button>
    <button class="ctl" id="pRepeat" aria-label="반복"></button>
  </div>
  <div class="p-extra">
    <button class="pill ghost" id="pEdit">앨범아트 · 정보 수정</button>
    <button class="pill ghost" id="pAdd">재생목록에 추가</button>
  </div>
</div>

<div id="sheet"><div id="sheetPanel"></div></div>
<div id="toast"></div>

<audio id="audio" playsinline preload="auto"></audio>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.mp4" multiple hidden>
<input type="file" id="imgIn" accept="image/*" hidden>

<script>
'use strict';
/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};
const fmtSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':(b/1048576).toFixed(b>=104857600?0:1)+' MB';
const readJSON=k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}};
const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
const shuffleArr=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const P={
  play:'M8 5v14l11-7z',
  pause:'M6 5h4v14H6zM14 5h4v14h-4z',
  next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',
  prev:'M6 6h2v12H6zM9.5 12l8.5 6V6z',
  shuffle:'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z',
  repeat:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',
  repeat1:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z',
  down:'M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z',
  more:'M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z'
};
const ico=(n,size=24)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor"><path d="${P[n]}"/></svg>`;
const grad=id=>{const h=[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `linear-gradient(135deg,hsl(${h},55%,40%),hsl(${(h+50)%360},60%,22%))`;};
function paintArt(el,t,url){
  const src=url||(t&&t.thumb);
  if(src){el.style.backgroundImage=`url("${src}")`;el.textContent='';}
  else{el.style.backgroundImage=grad(t?t.id:'x');el.textContent='♪';}
}
let toastTm;
function toast(msg,sticky){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTm);if(!sticky)toastTm=setTimeout(()=>t.classList.remove('show'),2800);}
const errMsg=e=>(e&&e.name==='QuotaExceededError')?'저장 공간이 부족해요':'저장하지 못했어요';

/* ================= 저장소 (IndexedDB) ================= */
let db;
const blobCache=new Map();
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('mymusic',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('arts');d.createObjectStore('playlists',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbGet=(s,k)=>reqP(db.transaction(s).objectStore(s).get(k));
const dbAll=s=>reqP(db.transaction(s).objectStore(s).getAll());
function write(stores,fn){return new Promise((res,rej)=>{
  const t=db.transaction(stores,'readwrite');
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));
  try{fn(t);}catch(e){try{t.abort();}catch{}rej(e);}
});}
function loadBlobCache(){return new Promise(res=>{try{
  const r=db.transaction('blobs').objectStore('blobs').openCursor();
  r.onsuccess=()=>{const c=r.result;if(c){blobCache.set(c.key,c.value);c.continue();}else res();};
  r.onerror=()=>res();
}catch{res();}});}
async function getBlob(id){if(blobCache.has(id))return blobCache.get(id);const b=await dbGet('blobs',id);if(b)blobCache.set(id,b);return b;}
const savePlaylist=l=>write(['playlists'],t=>t.objectStore('playlists').put(l));

/* ================= 상태 ================= */
const S={tracks:[],byId:new Map(),lists:[],tab:'songs',openList:null,q:'',
  queue:[],order:[],pos:-1,ctx:'all',shuffle:false,repeat:'off',curId:null};
{const s=readJSON('mm_settings')||{};S.shuffle=!!s.shuffle;S.repeat=['off','all','one'].includes(s.repeat)?s.repeat:'off';}
const saveSettings=()=>{try{localStorage.setItem('mm_settings',JSON.stringify({shuffle:S.shuffle,repeat:S.repeat}));}catch{}};
const sortedTracks=()=>[...S.tracks].sort((a,b)=>collator.compare(a.title,b.title));
function ctxIds(ctx){
  if(ctx==='all')return sortedTracks().map(t=>t.id);
  const l=S.lists.find(x=>x.id===ctx);
  return l?l.trackIds.filter(id=>S.byId.has(id)):[];
}
const getList=id=>S.lists.find(x=>x.id===id);
const openListObj=()=>getList(S.openList);

/* ================= 재생 엔진 ================= */
let audio=$('#audio');const AUDIO_EVENTS=[];const onAudio=(ty,fn)=>{AUDIO_EVENTS.push([ty,fn]);audio.addEventListener(ty,fn);};
let curUrl=null,bigUrl=null,loadTok=0,lastAutoplay=false,errStreak=0;

function buildOrder(startId){
  const n=S.queue.length;
  if(!n){S.order=[];S.pos=-1;return;}
  const idx=[...Array(n).keys()];
  const startIdx=Math.max(0,S.queue.indexOf(startId));
  if(S.shuffle){
    shuffleArr(idx);
    idx.splice(idx.indexOf(startIdx),1);
    idx.unshift(startIdx);
    S.order=idx;S.pos=0;
  }else{S.order=idx;S.pos=startIdx;}
}
function reshuffle(){
  const n=S.queue.length;
  const last=S.queue[S.order[S.pos]];
  const idx=shuffleArr([...Array(n).keys()]);
  if(n>1&&S.queue[idx[0]]===last)[idx[0],idx[1]]=[idx[1],idx[0]];
  S.order=idx;
}
const curTrackId=()=>S.queue[S.order[S.pos]];

function playList(ids,startId,ctx,forceShuffle){
  if(!ids.length)return;
  if(forceShuffle){S.shuffle=true;saveSettings();updateModes();}
  S.queue=ids.slice();S.ctx=ctx;
  const start=startId||(S.shuffle?ids[Math.floor(Math.random()*ids.length)]:ids[0]);
  buildOrder(start);
  loadTrack(start);
}

async function loadTrack(id,{autoplay=true,startAt=0}={}){
  const t=S.byId.get(id);if(!t)return;
  const tok=++loadTok;S.curId=id;lastAutoplay=autoplay;
  let blob=blobCache.get(id);
  if(!blob){try{blob=await getBlob(id);}catch{blob=null;}}
  if(tok!==loadTok)return;
  if(!blob){toast('파일을 불러올 수 없어요');return;}
  const old=curUrl;
  if(autoplay&&audio.getAttribute('src')&&audio.paused&&(hiddenWhilePaused||Date.now()-pausedAt>4000)){freshAudio();hiddenWhilePaused=false;}
  curUrl=URL.createObjectURL(blob);
  audio.src=curUrl;
  if(old)URL.revokeObjectURL(old);
  if(startAt>0)audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=startAt;}catch{}},{once:true});
  if(autoplay){audio.play().catch(e=>{console.warn(e);updatePlayState();});watchStall();}
  loadBigArt(t);
  render();
  saveSession();
}

function advance(dir,auto){
  const n=S.order.length;if(!n)return;
  if(auto&&S.repeat==='one'){audio.currentTime=0;audio.play().catch(()=>{});return;}
  let p=S.pos+dir;
  if(p>=n){
    if(auto&&S.repeat!=='all'){ // 큐 끝: 처음 곡으로 돌아가 멈춤
      if(S.shuffle)reshuffle();
      S.pos=0;loadTrack(curTrackId(),{autoplay:false});return;
    }
    if(S.shuffle)reshuffle();
    p=0;
  }else if(p<0)p=n-1;
  S.pos=p;loadTrack(curTrackId());
}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return;}advance(-1,false);}
let pausedAt=0,hiddenWhilePaused=false,stallTm=0;
/* iOS 버그 대응: 화면이 꺼진 채 이어폰 등으로 멈췄다가 재생하면 소리가 안 나는 경우가 있어
   오디오를 다시 불러와 같은 위치부터 재생하고, 재생 중인데 시간이 안 흐르면 한 번 더 복구해요 */
function freshAudio(){
  const old=audio;
  AUDIO_EVENTS.forEach(([ty,fn])=>old.removeEventListener(ty,fn));
  try{old.pause();}catch{}
  old.removeAttribute('src');try{old.load();}catch{}
  const a=document.createElement('audio');
  a.id='audio';a.setAttribute('playsinline','');a.preload='auto';
  old.replaceWith(a);
  audio=a;
  AUDIO_EVENTS.forEach(([ty,fn])=>a.addEventListener(ty,fn));
}
function reloadAndPlay(){
  const blob=S.curId&&blobCache.get(S.curId);
  if(!blob){audio.play().catch(()=>{});return;}
  const t=audio.currentTime||0,old=curUrl;freshAudio();
  curUrl=URL.createObjectURL(blob);
  audio.src=curUrl;
  if(old)URL.revokeObjectURL(old);
  audio.addEventListener('loadedmetadata',()=>{if(t>0)try{audio.currentTime=t;}catch{}},{once:true});
  audio.play().catch(()=>{});
  hiddenWhilePaused=false;
}
function watchStall(){
  clearTimeout(stallTm);
  const t0=audio.currentTime||0;
  stallTm=setTimeout(()=>{
    if(audio.paused||!S.curId)return;
    if(Math.abs((audio.currentTime||0)-t0)<0.2)reloadAndPlay();
  },1500);
}
function startPlayback(){
  if(!S.curId)return;
  if(audio.paused&&audio.getAttribute('src')&&(hiddenWhilePaused||Date.now()-pausedAt>4000))reloadAndPlay();
  else audio.play().catch(()=>{});
  watchStall();
}
function togglePlay(){if(!S.curId)return;if(audio.paused)startPlayback();else audio.pause();}
function toggleShuffle(){S.shuffle=!S.shuffle;if(S.queue.length)buildOrder(S.curId);saveSettings();updateModes();toast(S.shuffle?'셔플 켜짐':'셔플 꺼짐');}
function cycleRepeat(){S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';saveSettings();updateModes();toast({off:'반복 꺼짐',all:'전체 반복',one:'한 곡 반복'}[S.repeat]);}

function dropFromQueue(id){
  if(S.curId===id){
    loadTok++;audio.pause();audio.removeAttribute('src');audio.load();
    if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null;}
    S.curId=null;S.queue=S.queue.filter(x=>x!==id);S.order=[];S.pos=-1;
    if('mediaSession' in navigator)navigator.mediaSession.metadata=null;
    saveSession();return;
  }
  if(S.queue.includes(id)){S.queue=S.queue.filter(x=>x!==id);buildOrder(S.curId);}
}

onAudio('ended',()=>{hiddenWhilePaused=false;pausedAt=Date.now();advance(1,true);});
onAudio('play',()=>{updatePlayState();});
onAudio('pause',()=>{pausedAt=Date.now();if(document.hidden)hiddenWhilePaused=true;updatePlayState();saveSession();});
onAudio('playing',()=>{errStreak=0;});
onAudio('error',()=>{
  if(!audio.getAttribute('src'))return;
  toast('재생할 수 없는 파일이에요');
  if(lastAutoplay&&++errStreak<S.order.length)setTimeout(()=>advance(1,true),700);
});
onAudio('loadedmetadata',()=>{
  const t=S.byId.get(S.curId),d=audio.duration;
  $('#tDur').textContent=fmt(d);
  if(t&&d&&isFinite(d)&&Math.abs((t.duration||0)-d)>1){
    t.duration=d;write(['tracks'],tx=>tx.objectStore('tracks').put(t)).catch(()=>{});
    $$('.row[data-id="'+t.id+'"] .s').forEach(el=>{el.textContent=(t.artist||'알 수 없는 아티스트')+' · '+fmt(d);});
  }
});

const seek=$('#seek');
let dragging=false,lastSave=0,lastPS=0;
const setP=()=>seek.style.setProperty('--p',(seek.value/10)+'%');
onAudio('timeupdate',()=>{
  const d=audio.duration||0,c=audio.currentTime||0;
  if(!dragging){seek.value=d?Math.round(c/d*1000):0;setP();$('#tCur').textContent=fmt(c);}
  $('#mProg').style.width=d?(c/d*100)+'%':'0';
  const now=Date.now();
  if(now-lastSave>4000){lastSave=now;saveSession();}
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&d&&isFinite(d)&&now-lastPS>1000){
    lastPS=now;try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(c,d),playbackRate:audio.playbackRate||1});}catch{}
  }
});
seek.addEventListener('input',()=>{dragging=true;$('#tCur').textContent=fmt(seek.value/1000*(audio.duration||0));setP();});
seek.addEventListener('change',()=>{const d=audio.duration||0;if(d)audio.currentTime=seek.value/1000*d;dragging=false;});

function saveSession(){try{localStorage.setItem('mm_session',JSON.stringify({ctx:S.ctx,curId:S.curId,time:audio.currentTime||0}));}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveSession();if(audio.paused)hiddenWhilePaused=true;}});
addEventListener('pagehide',saveSession);

/* ----- 잠금화면 / 컨트롤 센터 ----- */
function setupMediaSession(){
  if(!('mediaSession' in navigator))return;
  const ms=navigator.mediaSession,set=(a,f)=>{try{ms.setActionHandler(a,f);}catch{}};
  set('play',()=>startPlayback());
  set('pause',()=>audio.pause());
  set('previoustrack',prev);
  set('nexttrack',()=>advance(1,false));
  set('seekto',d=>{if(d&&d.seekTime!=null)audio.currentTime=d.seekTime;});
}
function updateMediaSession(t){
  if(!('mediaSession' in navigator)||!t)return;
  const art=bigUrl?[{src:bigUrl,sizes:'600x600',type:'image/jpeg'}]:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}];
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||'',album:'내 음악',artwork:art});}catch{}
}

/* ----- 앨범아트 ----- */
async function loadBigArt(t){
  if(bigUrl){URL.revokeObjectURL(bigUrl);bigUrl=null;}
  paintArt($('#bigArt'),t,null);
  if(!t.hasArt){updateMediaSession(t);return;}
  let b=null;try{b=await dbGet('arts',t.id);}catch{}
  if(S.curId!==t.id)return;
  if(b){bigUrl=URL.createObjectURL(b);paintArt($('#bigArt'),t,bigUrl);}
  updateMediaSession(t);
}
function squareCanvas(img,size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const s=Math.min(img.naturalWidth,img.naturalHeight);
  c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);
  return c;
}
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('이미지를 읽을 수 없어요'));i.src=url;});
    const blob=await new Promise(r=>squareCanvas(img,600).toBlob(r,'image/jpeg',0.88));
    if(!blob)throw new Error('이미지를 처리하지 못했어요');
    return {blob,thumb:squareCanvas(img,120).toDataURL('image/jpeg',0.8)};
  }finally{URL.revokeObjectURL(url);}
}
function pickImage(cb){
  const i=$('#imgIn');
  i.onchange=()=>{const f=i.files[0];i.value='';if(f)cb(f);};
  i.click();
}

async function updateStorageInfo(){

  const total=S.tracks.reduce((a,t)=>a+(t.size||0),0);
  let txt=`곡 ${S.tracks.length}개 · ${fmtSize(total)} 저장됨`;
  try{const e=await navigator.storage.estimate();if(e&&e.quota)txt+=` · 허용 한도(추정) ${fmtSize(e.quota)}`;}catch{}

}

/* ================= 곡 가져오기 ================= */
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',m4b:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',wav:'audio/wav',flac:'audio/flac',aif:'audio/aiff',aiff:'audio/aiff',caf:'audio/x-caf'};
const BAD_EXT=['ogg','oga','opus','wma','ape','wv','mka'];
const extOf=n=>(n.split('.').pop()||'').toLowerCase();
async function importFiles(files){
  let ok=0,dup=0,bad=0,fail=0,quota=false;
  for(let i=0;i<files.length;i++){
    const f=files[i],ext=extOf(f.name);
    if(BAD_EXT.includes(ext)||(!MIME[ext]&&!(f.type||'').startsWith('audio/'))){bad++;continue;}
    if(S.tracks.some(t=>t.fname===f.name&&t.size===f.size)){dup++;continue;}
    toast(`추가 중… ${i+1}/${files.length}`,true);
    const type=MIME[ext]||f.type||'audio/mpeg';
    const id=uid();
    const meta={id,title:f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim()||f.name,artist:'',fname:f.name,size:f.size,type,duration:0,added:Date.now(),thumb:null,hasArt:false};
    try{
      const blob=new Blob([f],{type});
      await write(['tracks','blobs'],tx=>{tx.objectStore('blobs').put(blob,id);tx.objectStore('tracks').put(meta);});
      S.tracks.push(meta);S.byId.set(id,meta);ok++;
      try{const b=await dbGet('blobs',id);if(b)blobCache.set(id,b);}catch{}
    }catch(e){fail++;if(e&&e.name==='QuotaExceededError'){quota=true;break;}}
  }
  render();
  const parts=[];
  if(ok)parts.push(`${ok}곡 추가됨`);
  if(dup)parts.push(`중복 ${dup}곡 건너뜀`);
  if(bad)parts.push(`지원하지 않는 형식 ${bad}개 제외`);
  if(fail)parts.push(quota?'저장 공간이 부족해서 중단됐어요':`${fail}곡 실패`);
  toast(parts.join(' · ')||'추가된 곡이 없어요');
}
const pickFiles=()=>$('#fileIn').click();
$('#fileIn').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)importFiles(fs);});

/* ================= 곡 관리 ================= */
async function deleteTrack(id){
  const t=S.byId.get(id);if(!t)return;
  if(!confirm(`"${t.title}" 곡을 삭제할까요?\n(앱에 저장된 사본만 삭제돼요)`))return;
  try{
    const changed=S.lists.filter(l=>l.trackIds.includes(id));
    await write(['tracks','blobs','arts','playlists'],tx=>{
      tx.objectStore('tracks').delete(id);tx.objectStore('blobs').delete(id);tx.objectStore('arts').delete(id);
      changed.forEach(l=>{l.trackIds=l.trackIds.filter(x=>x!==id);tx.objectStore('playlists').put(l);});
    });
    blobCache.delete(id);
    dropFromQueue(id);
    S.tracks=S.tracks.filter(x=>x.id!==id);S.byId.delete(id);
    render();toast('삭제했어요');
  }catch(e){toast(errMsg(e));}
}
function editTrack(id){
  const t=S.byId.get(id);if(!t)return;
  let newArt;  // undefined: 변경 없음 / null: 제거 / {blob,thumb}: 새 이미지
  sheet('곡 정보 · 앨범아트',body=>{
    body.innerHTML=`<div class="ed-top"><div class="art mid" id="edArt"></div>
      <div class="ed-btns"><button class="pill" id="edPick">이미지 선택</button><button class="pill ghost" id="edDel">앨범아트 제거</button></div></div>
      <label class="field">제목<input type="text" id="edTitle"></label>
      <label class="field">아티스트<input type="text" id="edArtist" placeholder="(선택)"></label>
      <button class="pill wide" id="edSave" style="margin-top:18px">저장</button>`;
    const q=s=>body.querySelector(s);
    q('#edTitle').value=t.title;q('#edArtist').value=t.artist||'';
    const show=()=>{
      if(newArt===null)paintArt(q('#edArt'),{id:t.id});
      else if(newArt)paintArt(q('#edArt'),{id:t.id,thumb:newArt.thumb});
      else paintArt(q('#edArt'),t);
    };
    show();
    q('#edPick').onclick=()=>pickImage(async f=>{
      try{newArt=await processImage(f);show();}catch(e){toast(e.message||'이미지를 불러오지 못했어요');}
    });
    q('#edDel').onclick=()=>{newArt=null;show();};
    q('#edSave').onclick=async()=>{
      const nt={...t,title:q('#edTitle').value.trim()||t.title,artist:q('#edArtist').value.trim()};
      if(newArt===null){nt.thumb=null;nt.hasArt=false;}
      else if(newArt){nt.thumb=newArt.thumb;nt.hasArt=true;}
      try{
        await write(['tracks','arts'],tx=>{
          tx.objectStore('tracks').put(nt);
          if(newArt===null)tx.objectStore('arts').delete(id);
          else if(newArt)tx.objectStore('arts').put(newArt.blob,id);
        });
        Object.assign(t,nt);closeSheet();render();
        if(S.curId===id)loadBigArt(t);
        toast('저장했어요');
      }catch(e){toast(errMsg(e));}
    };
  });
}

/* ================= 재생목록 ================= */
async function createList(){
  const name=(prompt('새 재생목록 이름')||'').trim();
  if(!name)return null;
  const l={id:uid(),name,trackIds:[],created:Date.now()};
  try{await savePlaylist(l);}catch(e){toast(errMsg(e));return null;}
  S.lists.push(l);render();return l;
}
async function addToList(listId,ids){
  const l=getList(listId);if(!l)return;
  const add=ids.filter(i=>!l.trackIds.includes(i));
  if(!add.length){toast('이미 들어 있어요');return;}
  const old=l.trackIds;l.trackIds=[...old,...add];
  try{await savePlaylist(l);toast(`"${l.name}"에 ${add.length}곡 추가`);render();}
  catch(e){l.trackIds=old;toast(errMsg(e));}
}
function addToListSheet(ids){
  menu('재생목록에 추가',[
    {label:'＋ 새 재생목록 만들기',fn:async()=>{const l=await createList();if(l)await addToList(l.id,ids);}},
    ...S.lists.map(l=>({label:`${l.name} (${l.trackIds.length})`,fn:()=>addToList(l.id,ids)}))
  ]);
}
function pickSongsSheet(listId){

async function moveInList(listId,id,d){
  const l=getList(listId);if(!l)return;
  const i=l.trackIds.indexOf(id),j=i+d;
  if(i<0||j<0||j>=l.trackIds.length)return;
  const old=[...l.trackIds];
  [l.trackIds[i],l.trackIds[j]]=[l.trackIds[j],l.trackIds[i]];
  try{await savePlaylist(l);render();}catch(e){l.trackIds=old;toast(errMsg(e));}
}
async function removeFromList(listId,id){
  const l=getList(listId);if(!l)return;
  const old=l.trackIds;l.trackIds=old.filter(x=>x!==id);
  try{await savePlaylist(l);render();}catch(e){l.trackIds=old;toast(errMsg(e));}
}
function applyArtToList(listId){
  const l=getList(listId);if(!l)return;
  const ids=l.trackIds.filter(i=>S.byId.has(i));
  if(!ids.length){toast('곡이 없어요');return;}
  pickImage(async f=>{
    try{
      const art=await processImage(f);
      await write(['tracks','arts'],tx=>{
        ids.forEach(id=>{const t={...S.byId.get(id),thumb:art.thumb,hasArt:true};tx.objectStore('tracks').put(t);tx.objectStore('arts').put(art.blob,id);});
      });
      ids.forEach(id=>{const t=S.byId.get(id);t.thumb=art.thumb;t.hasArt=true;});
      render();if(ids.includes(S.curId))loadBigArt(S.byId.get(S.curId));
      toast(`${ids.length}곡에 앨범아트를 적용했어요`);
    }catch(e){toast(e.message&&!/abort/.test(e.message)?e.message:errMsg(e));}
  });
}
function trackMenu(id,listId){
  const t=S.byId.get(id);if(!t)return;
  const items=[
    {label:'재생',fn:()=>playList(listId?ctxIds(listId):songsView().map(x=>x.id),id,listId||'all')},
    {label:'재생목록에 추가',fn:()=>addToListSheet([id])},
    {label:'앨범아트 · 정보 수정',fn:()=>editTrack(id)}
  ];
  if(listId)items.push(
    {label:'위로 이동',fn:()=>moveInList(listId,id,-1)},
    {label:'아래로 이동',fn:()=>moveInList(listId,id,1)},
    {label:'이 재생목록에서 제거',fn:()=>removeFromList(listId,id)}
  );
  items.push({label:'곡 삭제',danger:true,fn:()=>deleteTrack(id)});
  menu(t.title,items);
}

/* ================= 이벤트 연결 ================= */
function bindList(ul,getCtx){
  ul.addEventListener('click',e=>{
    const row=e.target.closest('.row');if(!row||!row.dataset.id)return;
    const c=getCtx(),id=row.dataset.id;
    if(e.target.closest('[data-more]')){trackMenu(id,c.listId);return;}
    playList(c.ids,id,c.ctx);
  });
}
bindList($('#songList'),()=>({ids:songsView().map(t=>t.id),ctx:'all',listId:null}));
bindList($('#ldTracks'),()=>{const l=openListObj();return {ids:ctxIds(l.id),ctx:l.id,listId:l.id};});

$$('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.openList=null;render();$('main').scrollTop=0;}));
$('#listList').addEventListener('click',e=>{const r=e.target.closest('[data-list]');if(r){S.openList=r.dataset.list;render();$('main').scrollTop=0;}});
$('#backLists').onclick=()=>{S.openList=null;render();};
$('#newList').onclick=()=>createList();
$('#search').addEventListener('input',e=>{S.q=e.target.value;renderSongs();});

$('#btnAdd').onclick=pickFiles;$('#emptyAdd').onclick=pickFiles;
$('#playAll').onclick=()=>playList(songsView().map(t=>t.id),null,'all');
$('#shuffleAll').onclick=()=>playList(songsView().map(t=>t.id),null,'all',true);
$('#ldPlay').onclick=()=>{const l=openListObj();playList(ctxIds(l.id),null,l.id);};
$('#ldShuffle').onclick=()=>{const l=openListObj();playList(ctxIds(l.id),null,l.id,true);};
$('#ldAdd').onclick=()=>pickSongsSheet(S.openList);
$('#ldMenu').onclick=()=>{
  const l=openListObj();if(!l)return;
  menu(l.name,[
    {label:'곡 추가',fn:()=>pickSongsSheet(l.id)},
    {label:'이름 변경',fn:async()=>{
      const n=(prompt('재생목록 이름',l.name)||'').trim();if(!n)return;
      const old=l.name;l.name=n;
      try{await savePlaylist(l);render();}catch(e){l.name=old;toast(errMsg(e));}
    }},
    {label:'모든 곡에 같은 앨범아트 적용',fn:()=>applyArtToList(l.id)},
    {label:'재생목록 삭제',danger:true,fn:async()=>{
      if(!confirm(`"${l.name}" 재생목록을 삭제할까요?\n(곡 자체는 삭제되지 않아요)`))return;
      try{await write(['playlists'],tx=>tx.objectStore('playlists').delete(l.id));}catch(e){toast(errMsg(e));return;}
      S.lists=S.lists.filter(x=>x!==l);S.openList=null;render();
    }}
  ]);
};

$('#mini').addEventListener('click',e=>{if(!e.target.closest('button'))openPlayer();});
$('#mPlay').onclick=togglePlay;$('#pPlay').onclick=togglePlay;
$('#mNext').onclick=()=>advance(1,false);$('#pNext').onclick=()=>advance(1,false);
$('#pPrev').onclick=prev;$('#pShuffle').onclick=toggleShuffle;$('#pRepeat').onclick=cycleRepeat;
$('#closePlayer').onclick=closePlayer;
$('#pEdit').onclick=()=>editTrack(S.curId);
$('#pAdd').onclick=()=>addToListSheet([S.curId]);
{

/* ================= 시작 ================= */
/* ===== 업데이트 알림 =====
   새 버전을 만들 때: APP_VERSION을 1 올리고 CHANGES를 그 버전의 변경사항만으로 바꾸세요.
   (이전 버전 내용은 지우면 돼요. 새 버전이 처음 열릴 때 한 번만 표시돼요) */
const APP_VERSION=4;
const CHANGES=[
  '앱을 열지 않은 상태(홈 화면·화면 꺼짐)에서 이어폰으로 멈춘 뒤 재생·다음 곡을 눌러도 소리가 안 나던 문제 수정 (오디오를 새로 연결)',
  '업데이트 알림 추가: 새 버전이 적용되면 변경사항이 이 창으로 한 번만 표시돼요'
];
function checkUpdateNotice(){
  let seen=NaN;try{seen=parseInt(localStorage.getItem('mm_seen_ver'),10);}catch{}
  if(seen===APP_VERSION)return;
  const fresh=!seen&&!S.tracks.length&&!S.lists.length;   // 처음 설치한 사람에게는 표시하지 않음
  try{localStorage.setItem('mm_seen_ver',String(APP_VERSION));}catch{}
  if(fresh)return;
  sheet('업데이트 완료 · 버전 '+APP_VERSION,body=>{
    body.innerHTML='<ul style="padding-left:18px;margin:6px 0 16px;line-height:1.6">'+CHANGES.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul><button class="pill wide" id="chOk">확인</button>';
    body.querySelector('#chOk').onclick=closeSheet;
  });
}
function initIcons(){
  $('#verInfo').textContent='앱 버전 '+APP_VERSION;
  $('#btnAdd').innerHTML=ico('plus',18)+'곡 추가';
  $('#emptyAdd').innerHTML=ico('plus',18)+'곡 추가';
  $('#newList').innerHTML=ico('plus',18)+'새 재생목록';
  $('#playAll').innerHTML=ico('play',18)+'재생';
  $('#shuffleAll').innerHTML=ico('shuffle',18)+'셔플 재생';
  $('#ldPlay').innerHTML=ico('play',18)+'재생';
  $('#ldShuffle').innerHTML=ico('shuffle',18)+'셔플';
  $('#ldAdd').innerHTML=ico('plus',18)+'곡 추가';
  $('#ldMenu').innerHTML=ico('more');
  $('#closePlayer').innerHTML=ico('down',30);
  $('#pShuffle').innerHTML=ico('shuffle',26);
  $('#pPrev').innerHTML=ico('prev',32);
  $('#pNext').innerHTML=ico('next',32);
  $('#mNext').innerHTML=ico('next',26);
  updatePlayState();updateModes();
}
async function boot(){
  initIcons();setupMediaSession();
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!standalone&&!localStorage.getItem('mm_hint')){
    $('#installHint').hidden=false;
    $('#hintClose').onclick=()=>{$('#installHint').hidden=true;try{localStorage.setItem('mm_hint','1');}catch{}};
  }
  try{db=await openDB();}
  catch{toast('이 브라우저에서는 저장소를 쓸 수 없어요 (사생활 보호 모드일 수 있어요)',true);return;}
  try{
    const [tracks,lists]=await Promise.all([dbAll('tracks'),dbAll('playlists')]);
    S.tracks=tracks;S.byId=new Map(tracks.map(t=>[t.id,t]));S.lists=lists;
  }catch{toast('저장된 데이터를 읽지 못했어요',true);}
  render();
  checkUpdateNotice();
  const ss=readJSON('mm_session');
  if(ss&&S.byId.has(ss.curId)){
    let ctx=ss.ctx||'all',ids=ctxIds(ctx);
    if(!ids.includes(ss.curId)){ctx='all';ids=ctxIds('all');}
    S.ctx=ctx;S.queue=ids;buildOrder(ss.curId);
    loadTrack(ss.curId,{autoplay:false,startAt:ss.time||0});
  }
  loadBlobCache();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch{}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
